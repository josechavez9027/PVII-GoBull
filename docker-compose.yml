services:
  mysql:
    image: mysql:8.0
    container_name: gobull_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: gobull
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gobull

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gobull_backend
    environment:
      PORT: "3000"
      DATABASE_URL: mysql://user:password@mysql:3306/gobull
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gobull

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gobull_frontend
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - gobull

networks:
  gobull:

volumes:
  mysql_data: