<div class="app-shell">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="sidebar__topbar">
      <span class="sidebar__mark" aria-hidden="true">G</span>
      <span class="sidebar__brand" data-testid="brand">GoBull</span>
      <button class="icon-button icon-button--sidebar" type="button" aria-label="Contraer menú">
        ≡
      </button>
    </div>

    <nav class="sidebar__nav" style="margin-top: 2rem;">
      @for (item of navigation; track item.label) {
        <a
          class="nav-item"
          [class.nav-item--active]="item.active"
          href="#"
          (click)="$event.preventDefault()"
        >
          <span class="nav-item__icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <span class="status-dot" aria-hidden="true" style="background-color: var(--border-state-success);"></span><span>Sistema conectado</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumbs">
        <span>GoBull</span><span aria-hidden="true">/</span><strong>Inicio</strong>
      </div>
      <div class="topbar__actions">
        <button class="outline-button outline-button--info" type="button">
          Ayuda <span aria-hidden="true">⌄</span>
        </button>
        <button class="profile-button" type="button" aria-label="Abrir perfil">U</button>
      </div>
    </header>

    <section class="page-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
      <h1 class="text-display" style="margin-bottom: var(--space-4);">Bienvenido a GoBull</h1>
      <p class="text-body text-secondary" style="max-width: 400px; margin-bottom: var(--space-8);">
        El módulo principal de operaciones estará disponible próximamente en el siguiente Sprint.
      </p>
      
      <div class="empty-state-placeholder" style="width: 80px; height: 80px; opacity: 0.05; background-color: var(--text-primary); border-radius: 50%;"></div>
    </section>
  </main>
</div>
